<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- airoom app icon: the robot-face-in-a-room mark on a dark squircle tile.
       macOS Big Sur+ style: the artwork itself is the rounded rectangle.
       Flat colors only — no gradients, ever. -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#10141d"/>
  <rect x="70" y="70" width="884" height="884" rx="194" stroke="#ffffff" stroke-opacity="0.06" stroke-width="12"/>

  <!-- antenna -->
  <line x1="512" y1="238" x2="512" y2="312" stroke="#5eead4" stroke-width="40" stroke-linecap="round"/>
  <circle cx="512" cy="230" r="34" fill="#5eead4"/>

  <!-- head / room -->
  <rect x="292" y="312" width="440" height="400" rx="120" stroke="#5eead4" stroke-width="44"/>

  <!-- eyes -->
  <rect x="412" y="462" width="68" height="92" rx="28" fill="#5eead4"/>
  <rect x="544" y="462" width="68" height="92" rx="28" fill="#38bdf8"/>

  <!-- mouth / door -->
  <rect x="452" y="672" width="120" height="44" rx="20" fill="#5eead4"/>

  <!-- floor line, like the rooms' bottom wall -->
  <rect x="292" y="784" width="440" height="24" rx="12" fill="#ffffff" fill-opacity="0.10"/>
</svg>
